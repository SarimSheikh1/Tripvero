services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/tripvero?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET in the root .env}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5000}
    volumes:
      - uploads:/app/server/uploads
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo-data:
  uploads:
